plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxmeasure.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boxmeasure.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.1.4'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
