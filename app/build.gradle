plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxmeasure.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boxmeasure.app'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.3.3'
        multiDexEnabled false
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
