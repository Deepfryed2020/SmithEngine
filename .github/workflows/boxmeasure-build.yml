name: Build BoxMeasure Clean APK

on:
  push:
    branches:
      - boxmeasure-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Vendor offline Excel reader
        run: |
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output app/src/main/assets/xlsx.full.min.js
          test -s app/src/main/assets/xlsx.full.min.js
      - name: Check v1.3.0 source
        run: |
          node --check app/src/main/assets/import_overlay.js
          node --check app/src/main/assets/safety_overlay.js
          node --check app/src/main/assets/ultimate_overlay.js
          node --check app/src/main/assets/visual_export_overlay.js
          grep -q "versionName '1.3.0'" app/build.gradle
          grep -q "FALLBACK_VERSION='1.3.0'" app/src/main/assets/import_overlay.js
          grep -q "const VERSION='1.3.0'" app/src/main/assets/ultimate_overlay.js
          grep -q 'boxmeasure.media.v1' app/src/main/assets/ultimate_overlay.js
          grep -q 'Visual pick verification' app/src/main/assets/ultimate_overlay.js
          grep -q 'TAKE / CHOOSE' app/src/main/assets/ultimate_overlay.js
          grep -q 'BM_ProductPhoto' app/src/main/assets/visual_export_overlay.js
          grep -q 'BM_UnitPhoto' app/src/main/assets/visual_export_overlay.js
          grep -q 'BM_BoxPhoto' app/src/main/assets/visual_export_overlay.js
          grep -q 'ultimate_overlay.js' app/src/main/assets/import_overlay.js
          grep -q 'visual_export_overlay.js' app/src/main/assets/import_overlay.js
          grep -q 'ACTION_GET_CONTENT' app/src/main/java/com/boxmeasure/app/MainActivity.java
          grep -q 'openInventoryPicker' app/src/main/java/com/boxmeasure/app/MainActivity.java
          grep -q 'receiveBase64' app/src/main/assets/import_overlay.js
          grep -q 'android.intent.action.SEND' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VIEW' app/src/main/AndroidManifest.xml
          grep -q "none were dropped" app/src/main/assets/safety_overlay.js
          grep -q "Source inventory files are opened read-only" app/src/main/assets/safety_overlay.js
      - name: Compile BoxMeasure
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q '^assets/import_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/safety_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/ultimate_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/visual_export_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/xlsx.full.min.js$'
          unzip -p "$APK" assets/ultimate_overlay.js | grep -q 'Visual pick verification'
          unzip -p "$APK" assets/ultimate_overlay.js | grep -q 'boxmeasure.media.v1'
          unzip -p "$APK" assets/visual_export_overlay.js | grep -q 'BM_ProductPhoto'
          unzip -p "$APK" assets/import_overlay.js | grep -q "FALLBACK_VERSION='1.3.0'"
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          echo "DEX files: $DEX_COUNT"
          test "$DEX_COUNT" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt | head -20
          grep -q "versionName='1.3.0'" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'android.intent.action.SEND'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'android.intent.action.VIEW'
          cp "$APK" BoxMeasure-v1.3.0.apk
          sha256sum BoxMeasure-v1.3.0.apk > BoxMeasure-v1.3.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BoxMeasure-v1.3.0
          path: |
            BoxMeasure-v1.3.0.apk
            BoxMeasure-v1.3.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
