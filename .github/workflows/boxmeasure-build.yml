name: Build BoxMeasure Clean APK

on:
  push:
    branches:
      - boxmeasure-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Vendor offline Excel reader
        run: |
          curl --fail --location --retry 3 \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            --output app/src/main/assets/xlsx.full.min.js
          test -s app/src/main/assets/xlsx.full.min.js
      - name: Check v1.3.3 freeze hotfix source
        run: |
          node --check app/src/main/assets/import_overlay.js
          node --check app/src/main/assets/safety_overlay.js
          node --check app/src/main/assets/ultimate_overlay.js
          node --check app/src/main/assets/visual_export_overlay.js
          node --check app/src/main/assets/sheet131_overlay.js
          node --check app/src/main/assets/core132.js
          node --check app/src/main/assets/ui132.js
          node --check app/src/main/assets/export132.js
          node --check app/src/main/assets/bootstrap133.js
          node --check app/src/main/assets/safe_nav133.js
          grep -Fq "versionCode 24" app/build.gradle
          grep -Fq "versionName '1.3.3'" app/build.gradle
          grep -Fq "VERSION='1.3.3'" app/src/main/assets/core132.js
          grep -Fq "App version: 1.3.3" app/src/main/assets/export132.js
          grep -Fq "bootstrap133.js" app/src/main/java/com/boxmeasure/app/MainActivity.java
          ! grep -Fq "sheet131_overlay.js';document.head.appendChild" app/src/main/java/com/boxmeasure/app/MainActivity.java
          grep -Fq "characterData=false" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-safety-overlay-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-ultimate-overlay-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-sheet131-overlay-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-core132-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-ui132-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-export132-script" app/src/main/assets/bootstrap133.js
          grep -Fq "bm-safe-nav133-script" app/src/main/assets/bootstrap133.js
          grep -Fq "window.go=safeGo" app/src/main/assets/safe_nav133.js
          grep -Fq "window.__bm133Ready" app/src/main/java/com/boxmeasure/app/MainActivity.java
          grep -Fq 'EXPORT PAPER-LAYOUT CSV' app/src/main/assets/export132.js
          grep -Fq 'BM_CompletionRule' app/src/main/assets/export132.js
          grep -Fq 'boxmeasure.media.v1' app/src/main/assets/ultimate_overlay.js
          grep -Fq 'ACTION_GET_CONTENT' app/src/main/java/com/boxmeasure/app/MainActivity.java
          grep -Fq 'android.intent.action.SEND' app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.action.VIEW' app/src/main/AndroidManifest.xml
      - name: Compile BoxMeasure
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q '^assets/import_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/safety_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/ultimate_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/visual_export_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/sheet131_overlay.js$'
          unzip -Z1 "$APK" | grep -q '^assets/core132.js$'
          unzip -Z1 "$APK" | grep -q '^assets/ui132.js$'
          unzip -Z1 "$APK" | grep -q '^assets/export132.js$'
          unzip -Z1 "$APK" | grep -q '^assets/bootstrap133.js$'
          unzip -Z1 "$APK" | grep -q '^assets/safe_nav133.js$'
          unzip -Z1 "$APK" | grep -q '^assets/xlsx.full.min.js$'
          unzip -p "$APK" assets/bootstrap133.js | grep -Fq 'characterData=false'
          unzip -p "$APK" assets/bootstrap133.js | grep -Fq 'safe_nav133.js'
          unzip -p "$APK" assets/safe_nav133.js | grep -Fq 'window.go=safeGo'
          unzip -p "$APK" assets/core132.js | grep -Fq "VERSION='1.3.3'"
          unzip -p "$APK" assets/export132.js | grep -Fq 'EXPORT PAPER-LAYOUT CSV'
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          echo "DEX files: $DEX_COUNT"
          test "$DEX_COUNT" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt | head -20
          grep -Fq "versionCode='24'" badging.txt
          grep -Fq "versionName='1.3.3'" badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -Fq 'android.intent.action.SEND'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -Fq 'android.intent.action.VIEW'
          cp "$APK" BoxMeasure-v1.3.3.apk
          sha256sum BoxMeasure-v1.3.3.apk > BoxMeasure-v1.3.3.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BoxMeasure-v1.3.3
          path: |
            BoxMeasure-v1.3.3.apk
            BoxMeasure-v1.3.3.apk.sha256
          if-no-files-found: error
          retention-days: 30
